# pensieve: la API, sola en la red privada `pensieve_internal`. La SPA la sirve
# el nginx común de [`services/nginx-static`](../../services/nginx-static/), que
# se une a esa red para sus tres rutas de API — por eso la red lleva `name:`
# explícito: es la cadena que comparten los dos compose, sin depender del
# prefijo que cada proyecto le pone a sus redes.
#
# La carpeta del stack se llama `pensieve` y no puede cambiar, o el servidor se
# queda con el stack anterior huérfano.

services:
  # El nombre del servicio es el host al que proxea el nginx común.
  pensieve-api:
    image: docker.amatiasq.com/pensieve-api:latest
    container_name: amq-pensieve-api
    restart: unless-stopped
    environment:
      PORT: 8080
      # Los secretos de la OAuth App. Sin ellos el contenedor no arranca, a
      # propósito: `amq pensieve secrets` escribe el .env, que nunca sube por
      # rsync ni está en el repo.
      CLIENT_SECRET_DEV: ${CLIENT_SECRET_DEV}
      CLIENT_SECRET_PROD: ${CLIENT_SECRET_PROD}
    networks:
      - internal

networks:
  internal:
    name: pensieve_internal
