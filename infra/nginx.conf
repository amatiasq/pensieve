server {
    listen 80;

    # nginx-proxy termina el TLS, así que aquí sólo se ve http y un redirect por
    # nombre saldría con ese esquema. Relativos, y el esquema se conserva.
    absolute_redirect off;

    # El DNS interno de Docker. Es obligatorio y son dos cosas a la vez: un
    # `proxy_pass` con el nombre escrito literalmente lo resuelve nginx **al
    # cargar**, así que se queda con la IP que tenía el contenedor de la API —
    # que cambia cada vez que se recrea — y encima **nginx se niega a arrancar
    # si la API no está**, tirando la app entera por culpa de su API.
    #
    # Con el nombre en una variable se resuelve en cada petición, y ésa es la
    # pieza que le faltaba al `proxy_pass` a Cloudflare de antes: la variable
    # estaba, el `resolver` no, y por eso daba 502.
    resolver 127.0.0.11 valid=10s;
    set $pensieve_api pensieve-api;

    # La API, en la red `internal` del mismo stack: el navegador nunca sale de
    # este origen, así que no hay CORS.
    location /auth {
        proxy_pass http://$pensieve_api:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # El token de GitHub del usuario viaja en el body; nginx no loguea bodies.
    location /commit {
        proxy_pass http://$pensieve_api:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # El repo entero en una petición, en vez de una por nota. El token va en el
    # body, igual que en /commit.
    #
    # `proxy_buffering off` no es un detalle: son megas de gzip, y con buffering
    # nginx se los guarda antes de empezar a contestar. Y el `read_timeout` por
    # defecto son 60 s, que en un repo grande se agotan y el cliente cae al
    # listado fichero a fichero, que es justo lo que este endpoint evita.
    location /tarball {
        proxy_pass http://$pensieve_api:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # nginx no conoce esta extensión y la serviría como octet-stream, con lo que
    # el navegador no instala la PWA.
    location = /manifest.webmanifest {
        root /www;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Lo único con hash en el nombre, así que lo único que puede ser inmutable.
    location /assets/ {
        root /www;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # La SPA: `try_files` resuelve las rutas del router (/note/…, /settings) y
    # `/halt`, que es la app cargada sin lanzar el redirect de OAuth y por tanto
    # tiene que llegar con su JavaScript, no como un 200 vacío.
    #
    # `no-cache` es obligatorio y no es prudencia: index.html y sw.js son lo que
    # apunta a los assets con hash. Cacheados, el service worker ya instalado
    # sigue sirviendo el build viejo y el despliegue queda invisible.
    location / {
        root /www;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
